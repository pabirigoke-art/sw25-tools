<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SW2.5 動画制作ツール</title>
<style>
 :root{color-scheme:light dark;--fg:#1a1a1a;--bg:#fbfaf7;--mut:#5c5852;--line:#e2ddd4}
 @media (prefers-color-scheme:dark){:root{--fg:#ece8e1;--bg:#171614;--mut:#a39d93;--line:#333029}}
 body{margin:0;background:var(--bg);color:var(--fg);
  font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.85}
 main{max-width:40rem;margin:0 auto;padding:3rem 1rem}
 h1{font-size:1.5rem;margin:0 0 .5rem}
 p.lead{color:var(--mut);margin:0 0 2rem}
 h2{font-size:1.05rem;margin:2rem 0 .5rem;padding-top:1.25rem;border-top:1px solid var(--line)}
 ul{padding-left:1.2rem}
 a{color:inherit}
 footer{margin-top:3rem;padding-top:1.25rem;border-top:1px solid var(--line);
  color:var(--mut);font-size:.9rem}
</style></head><body><main>
<h1>SW2.5 動画制作ツール</h1>
<p class="lead">ソード・ワールド2.5のリプレイ動画を作るための、個人用の小さな道具立てです。</p>
<h2>何をするものか</h2>
<ul>
 <li>台本を置いたスプレッドシートを読み書きし、再生用のCSVを書き出す</li>
 <li>出来上がった動画を自分のYouTubeチャンネルへ投稿し、公開予定・サムネイル・再生リストを設定する</li>
 <li>自分のチャンネルの再生数や公開状態を読む</li>
</ul>
<h2>誰が使うのか</h2>
<p>作者本人だけです。配布も公開もしていません。</p>
<h2>プライバシー</h2>
<p><a href="./privacy.html">プライバシーポリシー</a></p>
<footer>個人の趣味で作っているものです。</footer>
</main></body></html>
